# =============================================================================
# answer — additions to /etc/nginx/sites-available/karma.rrj.pl.conf
#
# Paste these THREE location blocks inside the
# `server { listen 443 ssl; server_name karma.rrj.pl; }` block, next to the
# pushover and alerts blocks. Then REMOVE answer from the shared alternation,
# so it reads `location ~ ^/(?:gemini|time)/(.*)$`, and from
# `map $uri $mcp_backend` if it is listed there: that block denies GET, but
# /authorize is a GET reached by a browser redirect.
#
# Upstream: answer on 127.0.0.1:8086 (answer.service runs
# `bin/answer mcp -port 8086 -transport http`).
# Issuer   https://karma.rrj.pl/answer
# Resource https://karma.rrj.pl/answer/mcp
#
# These blocks do not include snippets/mcp.conf on purpose. That snippet sets
# X-Forwarded-For with $proxy_add_x_forwarded_for (append), which keeps a
# client-forged first entry; here the header is overwritten with $remote_addr.
# Everything else the snippet provides is spelled out here.
#
# NOTE: the previous answer proxying forwarded the original URI without
# stripping the prefix — fine for the MCP catch-all, but the OAuth routes
# registered in-process are /authorize, /login, /token, /register and the
# /.well-known/... paths, which only match once /answer/ is stripped. The
# trailing slash on the service proxy_pass below does that.
# =============================================================================

# --- 1. RFC 9728 protected-resource metadata -------------------------------
# Probe path = well-known prefix + resource path. Answer registers this
# literal path (internal/oauth/mount.go); pass it through unchanged.
location = /.well-known/oauth-protected-resource/answer/mcp {
    proxy_pass http://127.0.0.1:8086/.well-known/oauth-protected-resource/answer/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- 2. RFC 8414 authorization-server metadata -----------------------------
# Path-inserted because the issuer has a path component (/answer).
location = /.well-known/oauth-authorization-server/answer {
    proxy_pass http://127.0.0.1:8086/.well-known/oauth-authorization-server/answer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- 3. The service itself --------------------------------------------------
# The trailing slash on proxy_pass strips /answer/, so Answer sees
# /mcp, /authorize, /login, /token, /register, /health and /capabilities.
location ^~ /answer/ {
    limit_except GET POST DELETE OPTIONS { deny all; }

    proxy_pass http://127.0.0.1:8086/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, never append
    proxy_set_header X-Forwarded-Proto $scheme;

    # Answer caps MCP bodies at 4 MiB (maxMCPBodyBytes in auth.go); reject larger here.
    client_max_body_size 4m;

    # Streamable HTTP: no buffering, long timeouts — a deep web search runs
    # up to 15 minutes (httpWriteTimeout in transport.go).
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
}
