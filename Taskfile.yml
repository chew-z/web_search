# Taskfile is the Answer CLI's task-runner configuration — https://taskfile.dev
# Install the runner: brew install go-task
# List available tasks: task --list
version: "3"

vars:
  BINARY: answer
  BIN_DIR: bin
  # Use `.` for a single-package main.
  MAIN_PKG: .
  BINARY_PATH: "{{.BIN_DIR}}/{{.BINARY}}"

env:
  # Flip this if the project needs cgo.
  CGO_ENABLED: "0"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the binary into bin/
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY_PATH}}"
    cmds:
      - go build -o {{.BINARY_PATH}} {{.MAIN_PKG}}

  run:
    desc: 'Build and run the CLI (pass args after --, e.g. `task run -- "your query"`)'
    deps: [build]
    cmds:
      - "{{.BINARY_PATH}} {{.CLI_ARGS}}"

  test:
    desc: Run the full test suite with verbose output
    cmds:
      - go test -v ./...

  test:short:
    desc: Run tests without verbose output
    cmds:
      - go test ./...

  cover:
    desc: Run tests with coverage and open the HTML report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  fmt:
    desc: Format all Go files with gofmt
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint and auto-fix where possible
    cmds:
      - golangci-lint run --fix ./...

  lint:ci:
    desc: Run golangci-lint without auto-fixing
    cmds:
      - golangci-lint run ./...

  lint:md:
    desc: Lint Markdown, including rule files
    cmds:
      - markdownlint-cli2 "**/*.md"

  tidy:
    desc: Tidy and verify module dependencies
    cmds:
      - go mod tidy
      - go mod verify

  deps:update:
    desc: Update dependencies, then tidy
    cmds:
      - go get -u ./...
      - go mod tidy

  check:
    desc: Run the quality gate
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint:ci
      - task: test:short

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY_PATH}} coverage.out

  release:
    desc: Build a release binary into bin/
    cmds:
      - go build -o {{.BINARY_PATH}} {{.MAIN_PKG}}
      - 'echo "Built {{.BINARY_PATH}}"'
